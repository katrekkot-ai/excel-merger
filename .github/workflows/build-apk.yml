name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            autopoint gettext m4 autoconf automake libtool libtool-bin pkg-config \
            ninja-build patchelf
          echo "autopoint: $(command -v autopoint)"
          command -v autopoint >/dev/null

      - name: Update host Cython
        shell: bash
        run: |
          pip install --upgrade "Cython>=3.0,<4.0" wheel setuptools
          python -c "import Cython; print('Cython', Cython.__version__)"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: excelmerger-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          tail -n 400 build.log > logs/last-build-failure.log || echo "no build.log" > logs/last-build-failure.log
          git add logs/last-build-failure.log
          git commit -m "ci: build log tail [skip ci]" || exit 0
          git pull --rebase -q origin main || true
          git push
